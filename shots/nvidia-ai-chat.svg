<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#1a1a3a"/>
    </linearGradient>
    <linearGradient id="nvidia" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#76b900"/>
      <stop offset="100%" stop-color="#5a8f00"/>
    </linearGradient>
    <linearGradient id="user" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2d2d5e"/>
      <stop offset="100%" stop-color="#1e1e4a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="250" rx="12" fill="url(#bg)"/>
  <rect x="0" y="0" width="400" height="40" rx="12" fill="#0a0a1a"/>
  <rect x="0" y="24" width="400" height="16" fill="#0a0a1a"/>
  <rect x="12" y="10" width="20" height="20" rx="4" fill="url(#nvidia)"/>
  <text x="38" y="25" fill="#76b900" font-size="10" font-family="system-ui" font-weight="700">NVIDIA AI</text>
  <rect x="16" y="56" width="200" height="32" rx="8" fill="url(#user)"/>
  <text x="28" y="72" fill="#a5b4fc" font-size="9" font-family="system-ui">Explain how Transformers work</text>
  <text x="28" y="84" fill="#a5b4fc" font-size="9" font-family="system-ui">in simple terms</text>
  <rect x="80" y="100" width="304" height="44" rx="8" fill="url(#nvidia)"/>
  <text x="92" y="114" fill="#fff" font-size="9" font-family="system-ui" font-weight="500">Think of a Transformer like a very smart</text>
  <text x="92" y="126" fill="#fff" font-size="9" font-family="system-ui" font-weight="500">reader that looks at every word and decides</text>
  <text x="92" y="138" fill="#fff" font-size="9" font-family="system-ui" font-weight="500">which other words matter most...</text>
  <rect x="16" y="156" width="160" height="32" rx="8" fill="url(#user)"/>
  <text x="28" y="172" fill="#a5b4fc" font-size="9" font-family="system-ui">Switch to Qwen 3 Coder</text>
  <text x="28" y="184" fill="#a5b4fc" font-size="9" font-family="system-ui">and write bubble sort</text>
  <rect x="80" y="200" width="304" height="32" rx="8" fill="url(#nvidia)"/>
  <text x="92" y="216" fill="#fff" font-size="9" font-family="system-ui" font-weight="500">def bubble_sort(arr):</text>
  <text x="92" y="228" fill="#fff" font-size="9" font-family="system-ui" font-weight="500">    for i in range(len(arr)):</text>
  <text x="132" y="228" fill="#fff" font-size="9" font-family="system-ui" font-weight="500">for j in range(0, len(arr)-i-1):...</text>
</svg>
